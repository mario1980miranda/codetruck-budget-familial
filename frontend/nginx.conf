# Même rôle que le proxy de vite.config.ts, mais en production (docker-compose) :
# /api/* est envoyé au conteneur backend en retirant le préfixe /api.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }

    # Vue Router en mode history : toute route inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
